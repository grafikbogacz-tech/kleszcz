name: Deploy na FTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy schodykleszcz na FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: host184341.hostido.net.pl
          username: kubbista@schody.katowice.pl
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: schodykleszcz/
          server-dir: /public_html/
