<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="1.2" fill="#c8d8e0" opacity="0.5"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="400" height="300" fill="#f0f5f7"/>
  <rect width="400" height="300" fill="url(#dots)"/>

  <!-- Outer circle -->
  <circle cx="200" cy="138" r="70" fill="none" stroke="#8aaab8" stroke-width="2.5"/>

  <!-- Question mark – body curve -->
  <path d="M 172,108 C 172,88 228,88 228,115 C 228,132 208,138 208,155"
        fill="none" stroke="#8aaab8" stroke-width="9" stroke-linecap="round"/>

  <!-- Question mark – dot -->
  <circle cx="208" cy="170" r="6" fill="#8aaab8"/>

  <!-- Bottom label bar -->
  <rect y="240" width="400" height="60" fill="rgba(0,81,23,0.08)"/>
  <text x="200" y="263" font-family="'Oswald', Arial, sans-serif" font-size="12" fill="#005117" text-anchor="middle" letter-spacing="2" font-weight="300" opacity="0.7">RODZAJ DREWNA</text>
  <text x="200" y="285" font-family="'Oswald', Arial, sans-serif" font-size="17" fill="#005117" text-anchor="middle" letter-spacing="1" font-weight="500">Nie wiem – doradzę</text>
</svg>
