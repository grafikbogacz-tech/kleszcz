<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <pattern id="grain-olej" x="0" y="0" width="400" height="300" patternUnits="userSpaceOnUse">
      <path d="M 0 45 Q 110 40 195 48 Q 290 55 400 44" stroke="#8B5E2A" stroke-width="1.2" fill="none" opacity="0.5"/>
      <path d="M 0 80 Q 90 75 170 82 Q 280 89 400 77" stroke="#8B5E2A" stroke-width="0.8" fill="none" opacity="0.4"/>
      <path d="M 0 118 Q 140 112 215 120 Q 310 127 400 114" stroke="#8B5E2A" stroke-width="1.4" fill="none" opacity="0.45"/>
      <path d="M 0 155 Q 75 150 155 157 Q 265 164 400 151" stroke="#8B5E2A" stroke-width="0.9" fill="none" opacity="0.4"/>
      <path d="M 0 192 Q 125 187 205 194 Q 295 200 400 188" stroke="#8B5E2A" stroke-width="1.1" fill="none" opacity="0.4"/>
      <path d="M 0 228 Q 100 223 180 230 Q 310 237 400 225" stroke="#8B5E2A" stroke-width="0.7" fill="none" opacity="0.35"/>
    </pattern>
    <!-- Warm matte oil finish – no blue tint, deeper contrast -->
    <linearGradient id="matte" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#c8893a" stop-opacity="0.25"/>
      <stop offset="50%"  stop-color="#7a4a18" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c8893a" stop-opacity="0.2"/>
    </linearGradient>
    <!-- Subtle sheen (much softer than lacquer) -->
    <linearGradient id="soft-sheen" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Wood base – warmer, darker than lakier -->
  <rect width="400" height="300" fill="#A0622A"/>
  <rect width="400" height="300" fill="url(#grain-olej)"/>

  <!-- Oil warmth overlay (no blue, just amber depth) -->
  <rect width="400" height="300" fill="url(#matte)"/>
  <rect width="400" height="300" fill="url(#soft-sheen)"/>

  <!-- Very subtle highlight – matte, not mirror-like -->
  <ellipse cx="140" cy="90" rx="140" ry="18" fill="white" opacity="0.1" transform="rotate(-10 140 90)"/>

  <!-- Oil drop icon (centre, subtle) -->
  <path d="M 200 70 C 200 70 178 100 178 118 C 178 130 188 140 200 140 C 212 140 222 130 222 118 C 222 100 200 70 200 70 Z"
        fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2"/>
  <path d="M 190 120 C 190 113 196 109 200 109"
        stroke="rgba(255,255,255,0.5)" stroke-width="1.5" fill="none" stroke-linecap="round"/>

  <!-- Left edge highlight (matte boards have subtle edge catch) -->
  <rect width="2" height="300" fill="rgba(255,255,255,0.15)"/>

  <!-- Bottom label -->
  <rect y="240" width="400" height="60" fill="rgba(0,0,0,0.45)"/>
  <text x="200" y="263" font-family="'Oswald', Arial, sans-serif" font-size="12" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="2" font-weight="300">WYKOŃCZENIE</text>
  <text x="200" y="286" font-family="'Oswald', Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1" font-weight="400">Olej / wosk</text>
</svg>
