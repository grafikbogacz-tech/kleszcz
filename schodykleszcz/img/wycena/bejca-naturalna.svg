<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <pattern id="grain" x="0" y="0" width="400" height="300" patternUnits="userSpaceOnUse">
      <!-- Wood grain lines -->
      <path d="M 0 60 Q 120 55 200 62 Q 280 68 400 60" stroke="#C9935A" stroke-width="1.2" fill="none" opacity="0.5"/>
      <path d="M 0 90 Q 100 85 180 93 Q 300 100 400 88" stroke="#C9935A" stroke-width="0.8" fill="none" opacity="0.4"/>
      <path d="M 0 120 Q 150 115 220 122 Q 320 130 400 118" stroke="#C9935A" stroke-width="1.5" fill="none" opacity="0.45"/>
      <path d="M 0 150 Q 80 145 160 152 Q 260 160 400 148" stroke="#C9935A" stroke-width="0.9" fill="none" opacity="0.35"/>
      <path d="M 0 180 Q 130 175 210 183 Q 300 190 400 178" stroke="#C9935A" stroke-width="1.2" fill="none" opacity="0.5"/>
      <path d="M 0 210 Q 110 205 190 213 Q 290 220 400 208" stroke="#C9935A" stroke-width="0.7" fill="none" opacity="0.4"/>
      <path d="M 0 240 Q 160 235 240 242 Q 330 248 400 238" stroke="#C9935A" stroke-width="1.0" fill="none" opacity="0.45"/>
      <!-- Knot suggestion -->
      <ellipse cx="310" cy="140" rx="18" ry="12" stroke="#B8823C" stroke-width="1.2" fill="none" opacity="0.35"/>
      <ellipse cx="310" cy="140" rx="10" ry="7" stroke="#B8823C" stroke-width="0.8" fill="none" opacity="0.3"/>
    </pattern>
  </defs>
  <!-- Background plank colour -->
  <rect width="400" height="300" fill="#D4AA78"/>
  <!-- Grain overlay -->
  <rect width="400" height="300" fill="url(#grain)"/>
  <!-- Subtle vignette -->
  <rect width="400" height="300" fill="url(#vignette)" opacity="0.18"/>
  <!-- Bottom label bar -->
  <rect y="240" width="400" height="60" fill="rgba(0,0,0,0.45)"/>
  <!-- Label text -->
  <text x="200" y="263" font-family="'Oswald', Arial, sans-serif" font-size="13" fill="rgba(255,255,255,0.7)" text-anchor="middle" letter-spacing="2" font-weight="300">WYKOŃCZENIE</text>
  <text x="200" y="286" font-family="'Oswald', Arial, sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" letter-spacing="1" font-weight="400">Naturalny</text>
  <!-- Top border highlight -->
  <rect width="400" height="3" fill="rgba(255,255,255,0.25)"/>
</svg>
