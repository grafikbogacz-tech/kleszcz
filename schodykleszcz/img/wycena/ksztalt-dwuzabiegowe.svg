<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <rect width="320" height="320" fill="#ffffff"/>

  <!-- U-shape:
       Left arm:   x=20..110,  y=20..290
       Right arm:  x=210..300, y=20..290
       Top bridge: x=110..210, y=20..120  (landing / winder section)
  -->

  <!-- Left arm outer boundary (step lines = horizontal) -->
  <rect x="20" y="20" width="90" height="270" fill="none" stroke="#8aaab8" stroke-width="1.8"/>

  <!-- Right arm outer boundary -->
  <rect x="210" y="20" width="90" height="270" fill="none" stroke="#8aaab8" stroke-width="1.8"/>

  <!-- Top connecting bridge -->
  <rect x="110" y="20" width="100" height="100" fill="none" stroke="#8aaab8" stroke-width="1.8"/>

  <!-- Left arm step lines (horizontal dividers going up) – 12 steps -->
  <g stroke="#a8c2ce" stroke-width="1">
    <line x1="20" y1="42"  x2="110" y2="42"/>
    <line x1="20" y1="64"  x2="110" y2="64"/>
    <line x1="20" y1="86"  x2="110" y2="86"/>
    <line x1="20" y1="108" x2="110" y2="108"/>
    <line x1="20" y1="130" x2="110" y2="130"/>
    <line x1="20" y1="152" x2="110" y2="152"/>
    <line x1="20" y1="174" x2="110" y2="174"/>
    <line x1="20" y1="196" x2="110" y2="196"/>
    <line x1="20" y1="218" x2="110" y2="218"/>
    <line x1="20" y1="240" x2="110" y2="240"/>
    <line x1="20" y1="262" x2="110" y2="262"/>
  </g>

  <!-- Right arm step lines (horizontal dividers going down) – 12 steps -->
  <g stroke="#a8c2ce" stroke-width="1">
    <line x1="210" y1="42"  x2="300" y2="42"/>
    <line x1="210" y1="64"  x2="300" y2="64"/>
    <line x1="210" y1="86"  x2="300" y2="86"/>
    <line x1="210" y1="108" x2="300" y2="108"/>
    <line x1="210" y1="130" x2="300" y2="130"/>
    <line x1="210" y1="152" x2="300" y2="152"/>
    <line x1="210" y1="174" x2="300" y2="174"/>
    <line x1="210" y1="196" x2="300" y2="196"/>
    <line x1="210" y1="218" x2="300" y2="218"/>
    <line x1="210" y1="240" x2="300" y2="240"/>
    <line x1="210" y1="262" x2="300" y2="262"/>
  </g>

  <!-- Winder arcs in the top bridge (semi-circle from right to left) -->
  <!-- Centred at midpoint bottom of bridge (160,120) -->
  <g stroke="#a8c2ce" stroke-width="1">
    <!-- Radiating lines from (160,120) upward into bridge area -->
    <line x1="160" y1="120" x2="110" y2="120"/>
    <line x1="160" y1="120" x2="116" y2="88"/>
    <line x1="160" y1="120" x2="135" y2="54"/>
    <line x1="160" y1="120" x2="160" y2="20"/>
    <line x1="160" y1="120" x2="185" y2="54"/>
    <line x1="160" y1="120" x2="204" y2="88"/>
    <line x1="160" y1="120" x2="210" y2="120"/>
  </g>
  <!-- Semi-circle arcs -->
  <path d="M 110,120 A 50,50 0 0 1 210,120" fill="none" stroke="#8aaab8" stroke-width="1.4"/>
  <path d="M 130,120 A 30,30 0 0 1 190,120" fill="none" stroke="#8aaab8" stroke-width="1"/>

  <!-- Direction arrow at bottom of left arm -->
  <line x1="65" y1="280" x2="65" y2="298" stroke="#8aaab8" stroke-width="1.2"/>
  <polygon points="65,302 60,292 70,292" fill="#8aaab8"/>

  <!-- Corner dots -->
  <circle cx="20"  cy="20"  r="2.5" fill="#8aaab8"/>
  <circle cx="300" cy="20"  r="2.5" fill="#8aaab8"/>
  <circle cx="20"  cy="290" r="2.5" fill="#8aaab8"/>
  <circle cx="300" cy="290" r="2.5" fill="#8aaab8"/>

  <!-- Label -->
  <text x="160" y="314" font-family="'Oswald', Arial, sans-serif" font-size="13" fill="#005117" text-anchor="middle" letter-spacing="2" font-weight="500">DWUZABIEGOWE</text>
</svg>
