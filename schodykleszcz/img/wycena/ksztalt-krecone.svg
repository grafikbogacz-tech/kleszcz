<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <rect width="320" height="320" fill="#ffffff"/>

  <!-- Outer circle -->
  <circle cx="160" cy="155" r="128" fill="none" stroke="#8aaab8" stroke-width="1.8"/>

  <!-- Inner circle (central post) -->
  <circle cx="160" cy="155" r="18" fill="none" stroke="#8aaab8" stroke-width="1.8"/>
  <circle cx="160" cy="155" r="4"  fill="#8aaab8"/>

  <!-- Radiating step lines (12 lines = 12 steps, every 30°) -->
  <!-- Calculated endpoints on outer circle r=128, inner r=18 -->
  <g stroke="#a8c2ce" stroke-width="1">
    <!-- 0°   top -->
    <line x1="160" y1="137" x2="160" y2="27"/>
    <!-- 30°  -->
    <line x1="169" y1="140" x2="224" y2="48"/>
    <!-- 60°  -->
    <line x1="176" y1="155" x2="271" y2="91"/>
    <!-- 90°  right -->
    <line x1="178" y1="155" x2="288" y2="155"/>
    <!-- 120° -->
    <line x1="176" y1="170" x2="271" y2="219"/>
    <!-- 150° -->
    <line x1="169" y1="178" x2="224" y2="262"/>
    <!-- 180° bottom -->
    <line x1="160" y1="173" x2="160" y2="283"/>
    <!-- 210° -->
    <line x1="151" y1="178" x2="96"  y2="262"/>
    <!-- 240° -->
    <line x1="144" y1="170" x2="49"  y2="219"/>
    <!-- 270° left -->
    <line x1="142" y1="155" x2="32"  y2="155"/>
    <!-- 300° -->
    <line x1="144" y1="140" x2="49"  y2="91"/>
    <!-- 330° -->
    <line x1="151" y1="140" x2="96"  y2="48"/>
  </g>

  <!-- Step arcs at intermediate radii (every ~3 steps = 4 arcs) -->
  <circle cx="160" cy="155" r="50"  fill="none" stroke="#a8c2ce" stroke-width="1" stroke-dasharray="6 4"/>
  <circle cx="160" cy="155" r="80"  fill="none" stroke="#a8c2ce" stroke-width="1" stroke-dasharray="7 4"/>
  <circle cx="160" cy="155" r="108" fill="none" stroke="#a8c2ce" stroke-width="1" stroke-dasharray="8 4"/>

  <!-- Direction arrow (small arc with arrowhead near top) -->
  <path d="M 130,34 A 128,128 0 0 1 190,34" fill="none" stroke="#8aaab8" stroke-width="1.5"/>
  <polygon points="190,34 182,28 186,39" fill="#8aaab8"/>

  <!-- Label -->
  <text x="160" y="308" font-family="'Oswald', Arial, sans-serif" font-size="15" fill="#005117" text-anchor="middle" letter-spacing="2" font-weight="500">KRĘCONE</text>
</svg>
