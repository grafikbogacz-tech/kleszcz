<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="320" height="240">
  <rect width="320" height="240" fill="#ffffff"/>

  <!-- Outer staircase rectangle -->
  <rect x="22" y="72" width="276" height="86" fill="none" stroke="#8aaab8" stroke-width="1.8"/>

  <!-- Step dividers – 13 vertical lines = 14 steps -->
  <g stroke="#a8c2ce" stroke-width="1">
    <line x1="42"  y1="72" x2="42"  y2="158"/>
    <line x1="62"  y1="72" x2="62"  y2="158"/>
    <line x1="82"  y1="72" x2="82"  y2="158"/>
    <line x1="102" y1="72" x2="102" y2="158"/>
    <line x1="122" y1="72" x2="122" y2="158"/>
    <line x1="142" y1="72" x2="142" y2="158"/>
    <line x1="162" y1="72" x2="162" y2="158"/>
    <line x1="182" y1="72" x2="182" y2="158"/>
    <line x1="202" y1="72" x2="202" y2="158"/>
    <line x1="222" y1="72" x2="222" y2="158"/>
    <line x1="242" y1="72" x2="242" y2="158"/>
    <line x1="262" y1="72" x2="262" y2="158"/>
    <line x1="282" y1="72" x2="282" y2="158"/>
  </g>

  <!-- Handrail extension lines on left short side -->
  <line x1="10" y1="72"  x2="22" y2="72"  stroke="#8aaab8" stroke-width="1.8"/>
  <line x1="10" y1="158" x2="22" y2="158" stroke="#8aaab8" stroke-width="1.8"/>
  <line x1="10" y1="72"  x2="10" y2="158" stroke="#8aaab8" stroke-width="1.8"/>

  <!-- Direction arrow (left side, inside) -->
  <line x1="28" y1="115" x2="55" y2="115" stroke="#8aaab8" stroke-width="1.2"/>
  <polygon points="25,115 34,110 34,120" fill="#8aaab8"/>

  <!-- Corner dots -->
  <circle cx="22"  cy="72"  r="2.5" fill="#8aaab8"/>
  <circle cx="298" cy="72"  r="2.5" fill="#8aaab8"/>
  <circle cx="22"  cy="158" r="2.5" fill="#8aaab8"/>
  <circle cx="298" cy="158" r="2.5" fill="#8aaab8"/>

  <!-- Label -->
  <text x="160" y="205" font-family="'Oswald', Arial, sans-serif" font-size="15" fill="#005117" text-anchor="middle" letter-spacing="3" font-weight="500">PROSTE</text>
</svg>
